{% extends 'notices/base.html' %}

{% block title %}Create Notice - Notice Board{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fade-in">
    <div class="col-md-8 col-lg-6">
        <a href="{% url 'notices:home' %}" class="back-link mb-4">
            <span class="icon">←</span> Back to Dashboard
        </a>

        <div class="card glass-form-card border-0 shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="header-section mb-5">
                    <h2 class="font-weight-800 display-5" style="letter-spacing: -1.5px; color: #111827;">Post a New Notice</h2>
                    <p class="text-muted">Fill in the details below to update the board.</p>
                </div>

                
       
                
               <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}  <button type="submit">Submit for Approval</button>
</form>

                    
<style>
    /* --- Modern Glass Card --- */
    .glass-form-card {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        border-radius: 24px !important;
    }

    /* --- Labels & Text --- */
    .field-label {
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #4b5563;
        margin-bottom: 10px;
        display: block;
    }

    .optional-tag {
        text-transform: none;
        letter-spacing: 0;
        color: #9ca3af;
        font-weight: 400;
    }

    .text-muted-light {
        font-size: 0.8rem;
        color: #6b7280;
    }

    /* --- Back Link Interaction --- */
    .back-link {
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none !important;
        font-weight: 600;
        display: inline-block;
        transition: transform 0.2s ease, color 0.2s ease;
    }

    .back-link:hover {
        color: #fff;
        transform: translateX(-5px);
    }

    /* --- Input Styling --- */
    .custom-input {
        background: rgba(255, 255, 255, 0.5) !important;
        border: 1.5px solid rgba(0, 0, 0, 0.08) !important;
        border-radius: 14px !important;
        padding: 14px 18px !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: #1f2937 !important;
    }

    .custom-input:focus {
        background: #fff !important;
        border-color: #ffc107 !important;
        box-shadow: 0 10px 25px rgba(255, 193, 7, 0.15) !important;
        outline: none;
        transform: translateY(-2px);
    }

    /* --- File Upload Style --- */
    .file-upload-wrapper {
        padding: 15px;
        background: rgba(0, 0, 0, 0.03);
        border: 2px dashed rgba(0, 0, 0, 0.1);
        border-radius: 14px;
        transition: background 0.3s ease;
    }

    .file-upload-wrapper:hover {
        background: rgba(0, 0, 0, 0.05);
    }

    /* --- Primary Button --- */
    .btn-publish {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important;
        color: white !important;
        border: none !important;
        border-radius: 16px !important;
        padding: 16px !important;
        font-weight: 700 !important;
        letter-spacing: 0.02em;
        transition: all 0.3s ease !important;
    }

    .btn-publish:hover {
        transform: scale(1.02) translateY(-3px);
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.3) !important;
    }

    /* --- Animations --- */
    .animate-fade-in {
        animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}
