{% extends 'notices/base.html' %}

{% block title %}Explore Tags - NoticeBoard{% endblock %}

{% block content %}
<div class="animate-up">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="font-weight-800 text-white" style="letter-spacing: -1.5px;">Explore Categories</h1>
        <span class="badge badge-warning p-2 px-3 shadow-sm" style="border-radius: 10px;">{{ tags|length }} Active Tags</span>
    </div>

    <div class="row">
        {% for tag in tags %}
        <div class="col-md-3 col-sm-6 mb-4">
            <a href="{% url 'notices:tag' tag %}" class="text-decoration-none">
                <div class="card glass-tag-card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <span class="tag-name font-weight-700">{{ tag }}</span>
                        <span class="arrow">→</span>
                    </div>
                </div>
            </a>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <h4 class="text-white-50">No tags found.</h4>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .glass-tag-card {
        background: rgba(255, 255, 255, 0.85) !important;
        backdrop-filter: blur(15px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        border-radius: 18px !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-tag-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.95) !important;
        box-shadow: 0 15px 30px rgba(0,0,0,0.1) !important;
    }

    .tag-name {
        font-size: 1.1rem;
        color: #1a202c;
    }

    .arrow {
        color: #ffc107;
        font-weight: 800;
        opacity: 0;
        transition: 0.3s;
    }

    .glass-tag-card:hover .arrow {
        opacity: 1;
        transform: translateX(5px);
    }
</style>
{% endblock %}
