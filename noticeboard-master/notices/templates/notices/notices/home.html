<div class="container-fluid mb-5 animate-fade-in">
    <div class="glass-tag-nav p-3 d-flex align-items-center">
        <div class="nav-label mr-4 d-none d-md-block">
            <span class="text-uppercase small font-weight-800 tracking-wider text-white-50">Filter Content</span>
        </div>
        
        <div class="tag-scroll-container d-flex align-items-center">
            <a href="{% url 'notices:home' %}" class="tag-pill {% if not request.GET.tag %}active{% endif %}">
                All Announcements
            </a>

            {% for tag in tags %}
                <a href="?tag={{ tag.name }}" class="tag-pill {% if request.GET.tag == tag.name %}active{% endif %}">
                    #{{ tag.name }}
                </a>
            {% endfor %}
        </div>
    </div>
</div>

<style>
    /* --- Glassmorphism Container --- */
    .glass-tag-nav {
        background: rgba(255, 255, 255, 0.12) !important;
        backdrop-filter: blur(15px) saturate(180%);
        -webkit-backdrop-filter: blur(15px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        border-radius: 20px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
    }

    /* --- Horizontal Scroll UX --- */
    .tag-scroll-container {
        overflow-x: auto;
        white-space: nowrap;
        gap: 12px;
        -ms-overflow-style: none; /* IE/Edge */
        scrollbar-width: none;    /* Firefox */
    }

    .tag-scroll-container::-webkit-scrollbar {
        display: none; /* Chrome/Safari */
    }

    /* --- Professional Tag Pills --- */
    .tag-pill {
        display: inline-flex;
        align-items: center;
        padding: 10px 24px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        color: rgba(255, 255, 255, 0.85) !important;
        font-weight: 700;
        font-size: 0.85rem;
        text-decoration: none !important;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tag-pill:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
        color: #fff !important;
        border-color: rgba(255, 255, 255, 0.4);
    }

    /* --- Active Filter State --- */
    .tag-pill.active {
        background: #ffc107 !important; /* Your Brand Yellow */
        color: #111827 !important;     /* Dark text for contrast */
        border-color: #ffc107;
        box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);
    }

    .tracking-wider { letter-spacing: 0.12em; }
    
    .animate-fade-in {
        animation: fadeIn 0.7s ease-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-8px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
